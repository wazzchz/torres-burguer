function BuilderModal({ item, onClose, onConfirm }) {
  const [doneness, setDoneness] = useState("Ao ponto");
  const [extras, setExtras] = useState([]);
  const [size, setSize] = useState(ACAI_SIZES[1]);
  const [freeTop, setFreeTop] = useState(["Banana","Leite Ninho"]);
  const [paidTop, setPaidTop] = useState([]);
  const [qty, setQty] = useState(1);
  const [obs, setObs] = useState("");

  if(!item) return null;
  const isBurger = item.customizable==="burger";
  const isAcai = item.customizable==="acai";
  const themed = item.theme==="acai" || isAcai;

  const toggle = (list,set,v) => set(list.includes(v)?list.filter(x=>x!==v):[...list,v]);
  const toggleFree = (t) => {
    if(freeTop.includes(t)) setFreeTop(freeTop.filter(x=>x!==t));
    else { if(freeTop.length>=size.free) { setFreeTop([...freeTop.slice(1), t]); } else setFreeTop([...freeTop,t]); }
  };

  const unit = useMemo(()=>{
    let base = item.price;
    if(isAcai){ base = 16.9 * size.mult; if(item.id==="a2") base = Math.max(base, 21.9*size.mult/1.35); }
    const ex = extras.reduce((s,id)=>s+(BURGER_EXTRAS.find(e=>e.id===id)?.price||0),0)
      + paidTop.reduce((s,id)=>s+(ACAI_PAID.find(e=>e.id===id)?.price||0),0)
      + (isBurger||(!isAcai&&!isBurger) ? 0:0);
    const gen = (!isBurger&&!isAcai) ? extras.reduce((s,id)=>s+(GENERIC_ADDONS.find(e=>e.id===id)?.price||0),0) : 0;
    return base + ex + gen;
  },[item,isAcai,isBurger,size,extras,paidTop]);

  const confirm = () => {
    const details = [];
    if(isBurger){ details.push(`Ponto: ${doneness}`); extras.forEach(id=>{const e=BURGER_EXTRAS.find(x=>x.id===id); if(e) details.push(`+ ${e.name} (${brl(e.price)})`);}); }
    if(isAcai){ details.push(`Tamanho: ${size.label}`); if(freeTop.length) details.push(`Grátis: ${freeTop.join(", ")}`); paidTop.forEach(id=>{const e=ACAI_PAID.find(x=>x.id===id); if(e) details.push(`+ ${e.name} (${brl(e.price)})`);}); }
    if(!isBurger&&!isAcai&&item.customizable==="generic"){ extras.forEach(id=>{const e=GENERIC_ADDONS.find(x=>x.id===id); if(e) details.push(`+ ${e.name} (${brl(e.price)})`);}); }
    if(sanitize(obs)) details.push(`Obs: ${sanitize(obs)}`);
    onConfirm({ item, qty, unit, details });
  };

  return (
    <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="fixed inset-0 z-50 grid items-end justify-center bg-black/70 p-0 backdrop-blur-sm sm:items-center sm:p-4" onClick={onClose}>
      <motion.div initial={{y:120,scale:.98}} animate={{y:0,scale:1}} exit={{y:120,opacity:0}} transition={{type:"spring",stiffness:260,damping:26}}
        onClick={e=>e.stopPropagation()} className="glass max-h-[92dvh] w-full max-w-lg overflow-y-auto rounded-t-[28px] p-5 sm:rounded-[28px] sm:p-6">
        <div className="mx-auto mb-4 h-1.5 w-12 rounded-full bg-white/15 sm:hidden"></div>
        <div className="flex gap-4">
          <img src={item.img} alt={item.name} className="h-20 w-20 rounded-2xl object-cover ring-1 ring-white/15" />
          <div className="flex-1">
            <h3 className="font-display text-lg font-extrabold text-white">{item.name}</h3>
            <p className={`font-display text-xl font-extrabold ${themed?"text-gradient-berry":"text-gradient-lava"}`}>{brl(unit)} <span className="text-xs font-semibold text-zinc-400">/ un.</span></p>
          </div>
          <button onClick={onClose} className="h-9 w-9 rounded-xl bg-white/10 text-zinc-300 hover:bg-white/20" aria-label="Fechar">✕</button>
        </div>

        {isBurger && (
          <div className="mt-5">
            <p className="font-display text-sm font-extrabold text-orange-200">🔥 PONTO DA CARNE</p>
            <div className="mt-2 grid grid-cols-2 gap-2">
              {["Ao ponto","Bem passado"].map(p=>(
                <button key={p} onClick={()=>setDoneness(p)} className={`rounded-2xl px-4 py-3 text-sm font-bold ring-1 transition ${doneness===p?"bg-gradient-to-r from-[#FF3D00] to-[#FF5722] text-white ring-transparent shadow-lavaglow":"bg-white/5 text-zinc-300 ring-white/10"}`}>{p}</button>
              ))}
            </div>
            <p className="mt-5 font-display text-sm font-extrabold text-orange-200">➕ TURBINE SEU BURGER</p>
            <div className="mt-2 space-y-2">
              {BURGER_EXTRAS.map(e=>(
                <label key={e.id} className={`flex cursor-pointer items-center justify-between rounded-2xl px-4 py-3 ring-1 transition ${extras.includes(e.id)?"bg-[#FF3D00]/10 ring-[#FF3D00]/50":"bg-white/5 ring-white/10"}`}>
                  <span className="flex items-center gap-3 text-sm"><input type="checkbox" checked={extras.includes(e.id)} onChange={()=>toggle(extras,setExtras,e.id)} className="h-4 w-4 accent-[#FF3D00]" />{e.name}</span>
                  <span className="text-sm font-bold text-orange-300">+{brl(e.price)}</span>
                </label>
              ))}
            </div>
          </div>
        )}

        {isAcai && (
          <div className="mt-5">
            <p className="font-display text-sm font-extrabold text-purple-200">🟣 TAMANHO DO COPO</p>
            <div className="mt-2 grid grid-cols-3 gap-2">
              {ACAI_SIZES.map(s=>(
                <button key={s.id} onClick={()=>{setSize(s); setFreeTop([]);}} className={`rounded-2xl px-2 py-3 text-center ring-1 transition ${size.id===s.id?"bg-gradient-to-b from-[#7E22CE] to-[#A855F7] text-white ring-transparent shadow-berryglow":"bg-white/5 text-zinc-300 ring-white/10"}`}>
                  <span className="block font-display text-sm font-extrabold">{s.label}</span>
                  <span className="block text-[11px] opacity-80">{s.free} grátis</span>
                </button>
              ))}
            </div>
            <p className="mt-1 text-[11px] text-zinc-400">{size.desc} · até {size.free} toppings grátis (ao escolher o {size.free+1}º, o primeiro sai).</p>
            <p className="mt-4 font-display text-sm font-extrabold text-purple-200">✅ TOPPINGS GRÁTIS ({freeTop.length}/{size.free})</p>
            <div className="mt-2 flex flex-wrap gap-2">
              {ACAI_FREE.map(t=>(
                <button key={t} onClick={()=>toggleFree(t)} className={`rounded-full px-3.5 py-2 text-[13px] font-semibold ring-1 transition ${freeTop.includes(t)?"bg-[#A855F7] text-white ring-transparent shadow-berryglow":"bg-white/5 text-zinc-300 ring-white/10"}`}>{t}</button>
              ))}
            </div>
            <p className="mt-4 font-display text-sm font-extrabold text-purple-200">💜 EXTRAS PREMIUM</p>
            <div className="mt-2 space-y-2">
              {ACAI_PAID.map(e=>(
                <label key={e.id} className={`flex cursor-pointer items-center justify-between rounded-2xl px-4 py-3 ring-1 transition ${paidTop.includes(e.id)?"bg-[#A855F7]/15 ring-[#A855F7]/60":"bg-white/5 ring-white/10"}`}>
                  <span className="flex items-center gap-3 text-sm"><input type="checkbox" checked={paidTop.includes(e.id)} onChange={()=>toggle(paidTop,setPaidTop,e.id)} className="h-4 w-4 accent-[#A855F7]" />{e.name}</span>
                  <span className="text-sm font-bold text-purple-300">+{brl(e.price)}</span>
                </label>
              ))}
            </div>
          </div>
        )}

        {(!isBurger&&!isAcai&&item.customizable==="generic") && (
          <div className="mt-5">
            <p className="font-display text-sm font-extrabold text-zinc-200">➕ ADICIONAIS</p>
            <div className="mt-2 space-y-2">
              {GENERIC_ADDONS.map(e=>(
                <label key={e.id} className={`flex cursor-pointer items-center justify-between rounded-2xl px-4 py-3 ring-1 ${extras.includes(e.id)?"bg-white/10 ring-white/30":"bg-white/5 ring-white/10"}`}>
                  <span className="flex items-center gap-3 text-sm"><input type="checkbox" checked={extras.includes(e.id)} onChange={()=>toggle(extras,setExtras,e.id)} className="h-4 w-4 accent-white" />{e.name}</span>
                  <span className="text-sm font-bold">+{brl(e.price)}</span>
                </label>
              ))}
            </div>
          </div>
        )}

        <div className="mt-5">
          <label className="text-xs font-semibold text-zinc-400">Observações (ex: sem cebola, bem gelado)</label>
          <input value={obs} onChange={e=>setObs(e.target.value)} maxLength={140} placeholder="Opcional…" className="mt-1.5 w-full rounded-2xl bg-white/5 px-4 py-3 text-sm text-white ring-1 ring-white/10 placeholder:text-zinc-500" />
        </div>

        <div className="mt-5 flex items-center gap-3">
          <div className="flex items-center gap-3 rounded-2xl bg-white/5 px-2 py-2 ring-1 ring-white/10">
            <button onClick={()=>setQty(Math.max(1,qty-1))} className="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-lg font-bold">−</button>
            <span className="w-6 text-center font-display font-extrabold">{qty}</span>
            <button onClick={()=>setQty(Math.min(10,qty+1))} className="grid h-9 w-9 place-items-center rounded-xl bg-white text-lg font-bold text-black">+</button>
          </div>
          <motion.button whileTap={{scale:.97}} onClick={confirm}
            className={`flex-1 rounded-2xl px-4 py-3.5 font-display text-sm font-extrabold text-white ${themed?"bg-gradient-to-r from-[#7E22CE] to-[#A855F7] shadow-berryglow":"bg-gradient-to-r from-[#FF3D00] to-[#FF5722] shadow-lavaglow"}`}>
            ADICIONAR · {brl(unit*qty)}
          </motion.button>
        </div>
      </motion.div>
    </motion.div>
  );
}

function App(){
  const [active, setActive] = useState("burgueres");
  const [query, setQuery] = useState("");
  const [cart, setCart] = useState([]);
  const [builder, setBuilder] = useState(null);
  const [drawer, setDrawer] = useState(false);
  const [toast, setToast] = useState("");
  const [lockLeft, setLockLeft] = useState(0);
  const [form, setForm] = useState({ name:"", hood:"Jardim Imperial", street:"", number:"", pay:"Pix", change:"", notes:"" });
  const [errors, setErrors] = useState({});
  const lastOrder = useRef(0);
  const open = isOpenNow();
  const activeCat = CATEGORIES.find(c=>c.id===active);
  const theme = activeCat?.theme || "burger";

  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(""),2600); return ()=>clearTimeout(t); },[toast]);
  useEffect(()=>{ if(lockLeft<=0) return; const t=setTimeout(()=>setLockLeft(l=>l-1),1000); return ()=>clearTimeout(t); },[lockLeft]);

  const filtered = useMemo(()=>{
    const q = query.trim().toLowerCase();
    return MENU.filter(m=>m.cat===active && (!q || (m.name+" "+m.desc).toLowerCase().includes(q)));
  },[active,query]);

  const cartCount = cart.reduce((s,i)=>s+i.qty,0);
  const subtotal = cart.reduce((s,i)=>s+i.unit*i.qty,0);
  const fee = cart.length? (DELIVERY_FEES[form.hood] ?? 7) : 0;
  const total = subtotal + fee;

  const quickAdd = (item) => {
    if(item.customizable==="none"){
      setCart(prev=>{
        const key = item.id+"|plain";
        const ex = prev.find(p=>p.key===key);
        if(ex) return prev.map(p=>p.key===key?{...p,qty:Math.min(10,p.qty+1)}:p);
        return [...prev,{key,itemId:item.id,name:item.name,unit:item.price,qty:1,details:[]}];
      });
      setToast(`${item.name} na sacola ✅`);
    } else setBuilder(item);
  };

  const confirmBuilder = ({item,qty,unit,details}) => {
    const key = item.id+"|"+details.join("~")+"~"+Date.now();
    setCart(prev=>[...prev,{key,itemId:item.id,name:item.name,unit,qty,details}]);
    setBuilder(null); setToast(`${item.name} personalizado ✅`); setDrawer(true);
  };

  const buildMessage = () => {
    const lines = [];
    lines.push("*🍔 TORRES BURGUER & BORAÇAÍ — NOVO PEDIDO*");
    lines.push(`⏰ ${new Date().toLocaleString("pt-BR")} ${open?"(dentro do horário)":"(agendamento)"}`);
    lines.push("--------------------------");
    cart.forEach((ci,i)=>{
      lines.push(`*${i+1}. ${ci.qty}x ${ci.name}* — ${brl(ci.unit*ci.qty)}`);
      ci.details.forEach(d=>lines.push(`   · ${d}`));
    });
    lines.push("--------------------------");
    lines.push(`Subtotal: ${brl(subtotal)}`);
    lines.push(`Entrega (${form.hood}): ${fee===0?"Grátis":brl(fee)}`);
    lines.push(`*TOTAL: ${brl(total)}*`);
    lines.push("--------------------------");
    lines.push(`👤 Nome: ${form.name}`);
    lines.push(`📍 Endereço: ${form.street}${form.number?`, ${form.number}`:""} — ${form.hood}, Cuiabá/MT`);
    if(form.notes) lines.push(`📝 Ref: ${form.notes}`);
    lines.push(`💳 Pagamento: ${form.pay}${form.pay==="Dinheiro"&&form.change?` (troco p/ R$ ${form.change})`:""}`);
    lines.push("--------------------------");
    lines.push("Cupom: BORA10 (se aplicável) 🏷️");
    return lines.join("\n");
  };

  const placeOrder = () => {
    // DDoS / spam guard: 3s lockout (client-side rate limiting)
    const now = Date.now();
    if(now - lastOrder.current < 3000){ setLockLeft(Math.ceil((3000-(now-lastOrder.current))/1000)); return; }
    // sanitize + validate
    const name = sanitize(form.name), street = sanitize(form.street),
          number = sanitize(form.number), notes = sanitize(form.notes), change = sanitize(form.change);
    const e = {};
    if(!NAME_RE.test(name)) e.name = "Digite seu nome (2-60 letras, sem números).";
    if(!STREET_RE.test(street)) e.street = "Endereço inválido — ex: Av. das Torres, 1234.";
    if(cart.length===0) { setToast("Sacola vazia"); return; }
    setErrors(e);
    if(Object.keys(e).length) { setToast("Confira nome e endereço ⚠️"); return; }
    setForm(f=>({...f,name,street,number,notes,change}));
    lastOrder.current = now; setLockLeft(3);
    const url = `https://wa.me/${WHATS_NUMBER}?text=${encodeURIComponent(buildMessage())}`;
    window.open(url,"_blank","noopener");
    setToast("Pedido enviado p/ WhatsApp! 🚀");
  };

  const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({behavior:"smooth"});

  return (
    <div className="min-h-[100dvh]">
      <div className="bg-gradient-to-r from-[#FF3D00] via-[#a33] to-[#7E22CE] px-4 py-2 text-center text-[12px] font-bold text-white">
        🏷️ Use <span className="rounded bg-black/40 px-1.5 py-0.5 font-extrabold">BORA10</span> no WhatsApp e ganhe 10% OFF em combos · Entrega Jardim Imperial R$ 5
      </div>
      <Header cartCount={cartCount} onCart={()=>setDrawer(true)} open={open} />
      <Hero onBurger={()=>{setActive("burgueres");scrollTo("cardapio");}} onAcai={()=>{setActive("acai");scrollTo("cardapio");}} open={open} />

      <main id="cardapio" className="mx-auto max-w-6xl scroll-mt-32 px-4">
        <div className="mt-8 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h2 className="font-display text-2xl font-extrabold sm:text-3xl">
              Cardápio <span className={theme==="acai"?"text-gradient-berry":theme==="burger"?"text-gradient-lava":"text-white"}>{activeCat.label}</span>
            </h2>
            <p className="mt-1 text-sm text-zinc-400">Toque em <b>Montar +</b> para personalizar ponto, tamanho e toppings.</p>
          </div>
          <div className="relative w-full sm:w-72">
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="🔍 Buscar… ex: bacon, nutella, fritas" className="w-full rounded-2xl bg-white/5 px-4 py-3 text-sm ring-1 ring-white/10 placeholder:text-zinc-500" />
          </div>
        </div>

        <CategoryTabs cats={CATEGORIES} active={active} onChange={(id)=>{setActive(id);setQuery("");}} />

        <motion.div variants={container} initial="hidden" animate="show" key={active+query}
          className="grid grid-cols-1 gap-4 pb-10 pt-4 sm:grid-cols-2 lg:grid-cols-3">
          {filtered.map((m,i)=><MenuCard key={m.id} item={m} index={i} onAdd={quickAdd} />)}
          {filtered.length===0 && (
            <div className="col-span-full grid place-items-center rounded-3xl border border-dashed border-white/15 py-14 text-center">
              <p className="text-3xl">🔍</p><p className="mt-2 font-bold">Nada por aqui com “{query}”</p>
              <button onClick={()=>setQuery("")} className="mt-3 rounded-xl bg-white/10 px-4 py-2 text-sm font-bold">Limpar busca</button>
            </div>
          )}
        </motion.div>

        {/* trust / info */}
        <section className="grid gap-4 pb-12 md:grid-cols-3">
          {[
            ["📍 Onde estamos","Av. das Torres, Jardim Imperial — Cuiabá/MT. Retirada e delivery.","burger"],
            ["⏰ Horário","Seg–Dom · 18h às 23h30. Cozinha fecha 23h.", "neutral"],
            ["⚡ Entrega média","25–40 min no Imperial/Tijucal. Açaí sai em 10–15 min.","acai"],
          ].map(([t,d,kind])=>(
            <div key={t} className={`glass rounded-3xl p-5 ${kind==="acai"?"shadow-berryglow":kind==="burger"?"shadow-lavaglow":""}`}>
              <p className="font-display font-extrabold">{t}</p><p className="mt-1 text-sm text-zinc-400">{d}</p>
              <a href={`https://wa.me/${WHATS_NUMBER}?text=${encodeURIComponent("Olá! Quero fazer um pedido na Torres Burguer & Boraçaí 🍔🟣")}`} target="_blank" rel="noreferrer" className="mt-3 inline-block rounded-xl bg-white/10 px-4 py-2 text-[13px] font-bold hover:bg-white/20">Chamar no WhatsApp</a>
            </div>
          ))}
        </section>
      </main>

      <footer className="border-t border-white/10 bg-black/40 px-4 py-8 text-center">
        <p className="font-display font-extrabold">TORRES <span className="text-gradient-lava">BURGUER</span> <span className="text-gradient-berry">& BORAÇAÍ</span></p>
        <p className="mt-1 text-xs text-zinc-500">Feito com 🔥 e 🟣 em Cuiabá · Av. das Torres · +55 65 8427-0488 · © {new Date().getFullYear()}</p>
      </footer>

      {/* floating cart (mobile-first conversion) */}
      <AnimatePresence>
        {cartCount>0 && !drawer && (
          <motion.button initial={{y:80}} animate={{y:0}} exit={{y:80}} whileTap={{scale:.97}}
            onClick={()=>setDrawer(true)}
            className="fixed inset-x-4 bottom-4 z-40 flex items-center justify-between rounded-2xl bg-white px-5 py-4 text-black shadow-2xl sm:left-auto sm:right-6 sm:w-96">
            <span className="text-sm font-bold">🛒 {cartCount} {cartCount===1?"item":"itens"} · <span className="font-display font-extrabold">{brl(total)}</span></span>
            <span className="rounded-xl bg-black px-4 py-2 text-sm font-extrabold text-white">Finalizar →</span>
          </motion.button>
        )}
      </AnimatePresence>

      <AnimatePresence>{builder && <BuilderModal item={builder} onClose={()=>setBuilder(null)} onConfirm={confirmBuilder} />}</AnimatePresence>
      <CheckoutDrawer cart={cart} setQty={(k,q)=>{ if(q<=0) setCart(c=>c.filter(i=>i.key!==k)); else setCart(c=>c.map(i=>i.key===k?{...i,qty:Math.min(10,q)}:i)); }}
        removeItem={(k)=>setCart(c=>c.filter(i=>i.key!==k))} subtotal={subtotal} fee={fee} total={total}
        open={drawer} onClose={()=>setDrawer(false)} form={form} setForm={setForm} onOrder={placeOrder} lockLeft={lockLeft} errors={errors} />

      <AnimatePresence>
        {toast && <motion.div initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} exit={{opacity:0,y:20}} className="fixed bottom-24 left-1/2 z-[60] -translate-x-1/2 whitespace-nowrap rounded-2xl bg-white px-5 py-3 text-sm font-bold text-black shadow-2xl">{toast}</motion.div>}
      </AnimatePresence>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
